name: Publish Go module

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable module version matching README and CHANGELOG (for example v1.0.0)
        required: true
        type: string
      commit:
        description: Reviewed main commit (full 40-character SHA)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: go-production
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'nstdata-ai/crawl-go' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  preflight:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - run: go run ./internal/release check

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: go-production
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - run: go run ./internal/release tag
      - run: go run ./internal/release verify
